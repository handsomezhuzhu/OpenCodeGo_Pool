<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCode Pool</title>
    <!--
      Dark-mode flash prevention: apply .dark synchronously before React mounts.
      Logic must stay in sync with src/lib/theme.ts (key=ocp-theme, 3-state, default system).
    -->
    <script>
      ;(function () {
        try {
          var m = localStorage.getItem('ocp-theme')
          if (m !== 'light' && m !== 'dark' && m !== 'system') m = 'system'
          var dark =
            m === 'dark' ||
            (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
